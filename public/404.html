<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // GitHub Pages SPA redirect — preserves path for React Router
    const path = window.location.pathname.replace('/MF-Tracker', '') || '/';
    window.location.replace('/MF-Tracker/?p=' + encodeURIComponent(path));
  </script>
</head>
<body></body>
</html>
